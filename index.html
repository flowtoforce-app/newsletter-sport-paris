<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paris Sport Week</title>
  <meta name="description" content="Une newsletter sport, chaque lundi. Paris, terrain, culture, business. 100 % gratuit, pas de spam.">
  <meta property="og:title" content="Paris Sport Week">
  <meta property="og:description" content="Une newsletter sport, chaque lundi. Paris, terrain, culture, business. 100 % gratuit, pas de spam.">
  <meta property="og:url" content="https://parissportweek.fr">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Paris Sport Week">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;1,300;1,400&family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #2D2926;
      --blue: #6E6A65;
      --baby: #D9D6D1;
      --white: #ffffff;
      --off: #F5F3F1;
      --text: #2D2926;
      --muted: #86807A;
    }

    html { scroll-behavior: smooth; background: #ffffff; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: #ffffff;
      overflow-x: hidden;
      padding-top: 60px;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      background: #111 url('hero-photo.jpg') center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 48px 32px;
      text-align: left;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.05) 70%);
      pointer-events: none;
    }

    .hero-collab {
      position: relative;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 10px;
    }

    .hero-title {
      position: relative;
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(40px, 9vw, 76px);
      font-weight: 400;
      color: var(--white);
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero-byline {
      position: relative;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: 32px;
    }

    .hero-bubbles {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-bubble {
      display: inline-flex;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--navy);
      background: #ffffff;
      padding: 12px 22px;
      border-radius: 50px;
      text-decoration: none;
      white-space: nowrap;
    }

    .hero-bubble.outline {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.6);
    }

    /* FORM */
    .form-wrap {
      width: auto;
    }

    .form-row {
      display: flex;
      gap: 0;
      background: #ffffff;
      border: none;
      border-radius: 50px;
      overflow: hidden;
      padding: 4px 4px 4px 18px;
    }

    .form-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--navy);
      min-width: 0;
      width: 130px;
    }

    .form-row input::placeholder {
      color: var(--muted);
    }

    .form-row input:-webkit-autofill,
    .form-row input:-webkit-autofill:hover,
    .form-row input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
      -webkit-text-fill-color: var(--navy) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .form-row button {
      background: var(--navy);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 11px 20px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .form-note {
      position: relative;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-top: 14px;
    }

    /* ── SECTIONS ── */
    .section {
      padding: 80px 24px;
      max-width: 680px;
      margin: 0 auto;
    }

    .section-full {
      padding: 80px 24px;
      background: var(--off);
    }

    .section-full-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    .chip {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--baby);
      padding: 4px 14px;
      border-radius: 50px;
      margin-bottom: 24px;
    }

    .section-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 300;
      color: var(--navy);
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .section-title em {
      font-style: italic;
      color: var(--muted);
    }

    .section-sub {
      font-size: 15px;
      line-height: 1.8;
      color: #5a607a;
      margin-bottom: 48px;
    }

    /* RUBRIQUES GRID */
    .rubriques {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .rubrique-card {
      background: var(--white);
      border: 1px solid #eaecf2;
      border-radius: 12px;
      padding: 24px;
    }

    .rubrique-num {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--baby);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .rubrique-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .rubrique-desc {
      font-size: 13px;
      line-height: 1.7;
      color: #5a607a;
    }

    /* CAROUSEL */
    .carousel-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      cursor: grab;
      padding-bottom: 4px;
      margin: 0 -20px;
      padding-left: 20px;
    }
    .carousel-wrap::-webkit-scrollbar { display: none; }
    .carousel-wrap:active { cursor: grabbing; }

    .carousel {
      display: flex;
      gap: 14px;
      width: max-content;
      padding-right: 20px;
    }

    .nl-card {
      width: 240px;
      height: 380px;
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #000044;
      border: 1px solid rgba(137,184,232,0.12);
      transition: transform 0.2s, border-color 0.2s;
    }
    .nl-card:hover {
      transform: translateY(-4px);
      border-color: rgba(137,184,232,0.28);
    }

    /* Card avec screenshot */
    .nl-card-preview {
      height: 52%;
      overflow: hidden;
      flex-shrink: 0;
      background: #f5f7fd;
    }

    .nl-card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }

    .nl-card-body-area {
      flex: 1;
      background: #00003a;
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 1px solid rgba(137,184,232,0.12);
    }

    .nl-card-num {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--baby);
      opacity: 0.6;
      margin-bottom: 8px;
    }

    .nl-card-theme {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 16px;
      font-weight: 400;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 7px;
    }

    .nl-card-sub {
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      line-height: 1.5;
      flex: 1;
    }

    .nl-card-cta {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--baby);
      opacity: 0.5;
      margin-top: 12px;
    }

    /* Cards thématiques */
    .nl-card-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .nl-card-accent {
      height: 3px;
      background: linear-gradient(to right, #4169E1, #89B8E8);
      flex-shrink: 0;
    }

    .nl-card-content {
      flex: 1;
      padding: 22px 20px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .nl-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: auto;
    }

    .nl-label {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(137,184,232,0.55);
    }

    .nl-lock {
      font-size: 10px;
      opacity: 0.3;
    }

    .nl-big-num {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 72px;
      font-weight: 400;
      color: rgba(255,255,255,0.04);
      line-height: 1;
      letter-spacing: -3px;
      margin: 16px 0 0 -4px;
      flex-shrink: 0;
    }

    .nl-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 21px;
      font-weight: 400;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .nl-excerpt {
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,255,255,0.42);
      line-height: 1.6;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .nl-card-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .nl-date {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    .nl-read {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(137,184,232,0.45);
    }

    .nl-card-watermark {
      position: absolute;
      top: -10px;
      right: -8px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 130px;
      font-weight: 400;
      color: rgba(255,255,255,0.05);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    /* LYS BIO */
    .bio {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .bio-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--off);
      border: 2px solid var(--baby);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      color: var(--navy);
    }

    .bio-text {}

    .bio-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .bio-role {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--baby);
      margin-bottom: 12px;
    }

    .bio-desc {
      font-size: 14px;
      line-height: 1.75;
      color: #5a607a;
    }

    /* CTA FINAL */
    .cta-block {
      background: var(--navy);
      padding: 80px 24px;
      text-align: center;
    }

    .cta-inner {
      max-width: 520px;
      margin: 0 auto;
    }

    .cta-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 300;
      color: var(--white);
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .cta-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 36px;
      line-height: 1.7;
    }

    .cta-form {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(137,184,232,0.3);
      border-radius: 50px;
      overflow: hidden;
      padding: 5px 5px 5px 20px;
      max-width: 420px;
      margin: 0 auto 16px;
    }

    .cta-form input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--white);
      min-width: 0;
    }

    .cta-form input::placeholder { color: rgba(137,184,232,0.5); }

    .cta-form button {
      background: var(--white);
      color: var(--navy);
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cta-note {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(137,184,232,0.35);
    }

    /* FOOTER */
    .footer {
      background: var(--navy);
      padding: 40px 24px;
      text-align: center;
    }

    .footer-logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-weight: 300;
      color: var(--white);
      letter-spacing: 4px;
      margin-bottom: 4px;
    }
    .footer-logo span { color: var(--baby); }

    .footer-sub {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--baby);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .footer-links a {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(217,214,209,0.7);
      text-decoration: none;
    }

    .thomas-credit {
      margin-top: 24px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .footer-credit {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: rgba(217,214,209,0.3);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .footer-legal {
      font-size: 11px;
      color: rgba(255,255,255,0.2);
    }

    /* ── TOP NAV ── */
    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      background: #ffffff;
      border-bottom: 1px solid var(--baby);
    }

    .topnav-logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--navy);
      letter-spacing: 0.5px;
      text-decoration: none;
    }

    .topnav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 50px;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ── PARTNER SECTION ── */
    .partner-section {
      padding: 80px 24px;
      background: var(--white);
      border-top: 1px solid #eaecf2;
    }

    .partner-inner {
      max-width: 560px;
      margin: 0 auto;
    }

    .partner-form-wrap {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 40px;
    }

    .partner-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .partner-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue);
    }

    .partner-input,
    .partner-textarea {
      background: var(--off);
      border: 1px solid #eaecf2;
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .partner-input:focus,
    .partner-textarea:focus {
      border-color: var(--blue);
    }

    .partner-textarea {
      resize: vertical;
      min-height: 110px;
    }

    .partner-submit {
      background: var(--blue);
      color: #ffffff;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 16px 40px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      align-self: flex-start;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .bio { flex-direction: column; gap: 16px; }
      .teaser { padding: 28px 20px; }
      .form-row button { padding: 12px 16px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <!-- TOP NAV -->
  <nav class="topnav">
    <a class="topnav-logo" href="/"></a>
    <a class="topnav-btn" href="/partenaire">Proposer une collaboration</a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1 class="hero-title">PSW</h1>

    <div class="hero-bubbles">
      <div class="form-wrap">
        <form class="form-row" onsubmit="handleSubmit(event)">
          <input type="email" id="email-hero" placeholder="ton@email.com" required>
          <button type="submit">S'abonner à la newsletter</button>
        </form>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-links">
      <a href="https://www.instagram.com/paris_sport_week/" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:middle;margin-right:5px;"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram
      </a>
      <a href="https://www.tiktok.com/@lisa_lys_" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:5px;"><path d="M16.6 5.82c-1.02-.9-1.66-2.22-1.66-3.68V2h-3.4v14.2c0 1.6-1.3 2.9-2.9 2.9s-2.9-1.3-2.9-2.9 1.3-2.9 2.9-2.9c.3 0 .58.05.85.13v-3.47a6.2 6.2 0 0 0-.85-.06 6.3 6.3 0 1 0 6.3 6.3V9.1a8.6 8.6 0 0 0 5.06 1.63V7.33c-1.28 0-2.46-.42-3.4-1.14v-.37z"/></svg>TikTok
      </a>
      <a href="mailto:parissportweek@protonmail.com">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:middle;margin-right:5px;"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>Contact
      </a>
    </div>
    <div class="footer-legal">© 2026 Paris Sport Week · <a href="/privacy.html" style="color:inherit;text-decoration:none;">Confidentialité</a> · <a href="/terms.html" style="color:inherit;text-decoration:none;">CGU</a></div>
  </footer>

  <script>
    // Partner form
    document.getElementById('partner-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = document.getElementById('partner-form');
      var data = new FormData(form);
      data.append('_subject', 'Nouvelle candidature partenaire Paris Sport Week');
      data.append('_captcha', 'false');
      fetch('https://formsubmit.co/ajax/parissportweek@protonmail.com', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: data
      })
      .then(function() {
        form.style.display = 'none';
        document.getElementById('partner-success').style.display = 'block';
      })
      .catch(function() {
        form.style.display = 'none';
        document.getElementById('partner-success').style.display = 'block';
      });
    });

    // Carousel drag-to-scroll
    (function() {
      var c = document.getElementById('carousel');
      if (!c) return;
      var isDown = false, startX, scrollLeft;
      c.addEventListener('mousedown', function(e) { isDown = true; startX = e.pageX - c.offsetLeft; scrollLeft = c.scrollLeft; });
      c.addEventListener('mouseleave', function() { isDown = false; });
      c.addEventListener('mouseup', function() { isDown = false; });
      c.addEventListener('mousemove', function(e) { if (!isDown) return; e.preventDefault(); var x = e.pageX - c.offsetLeft; c.scrollLeft = scrollLeft - (x - startX); });
    })();

    function handleSubmit(e) {
      e.preventDefault();
      var emailHero = document.getElementById('email-hero');
      var emailCta = document.getElementById('email-cta');
      var email = (emailHero && emailHero.value) || (emailCta && emailCta.value) || '';
      var msg = "<p style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#2D2926;padding:12px 0;\">Merci · Check ta boîte.</p>";
      document.querySelectorAll('.form-wrap').forEach(function(el) { el.innerHTML = msg; });
      var ctaForm = document.querySelector('.cta-form');
      if (ctaForm) ctaForm.innerHTML = msg;
      fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      }).catch(function() {});
    }
  </script>

</body>
</html>
