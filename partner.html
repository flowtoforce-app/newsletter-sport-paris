<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposer une collaboration · Paris Sport Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;1,300;1,400&family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #2D2926;
      --blue: #6E6A65;
      --baby: #D9D6D1;
      --white: #ffffff;
      --off: #F5F3F1;
      --text: #2D2926;
      --muted: #86807A;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--white);
      padding-top: 60px;
    }

    /* NAV */
    .topnav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--baby);
    }

    .topnav-logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--navy);
      letter-spacing: 3px;
      text-decoration: none;
    }
    .topnav-logo span { color: var(--muted); }

    .topnav-back {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
    }

    /* PAGE */
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 80px 24px 100px;
    }

    .chip {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 4px 14px;
      border-radius: 50px;
      margin-bottom: 24px;
    }

    .page-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--navy);
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .page-title em {
      font-style: italic;
      color: var(--blue);
    }

    .page-sub {
      font-size: 15px;
      line-height: 1.8;
      color: #5a607a;
      margin-bottom: 52px;
    }

    /* FORM */
    .form-wrap {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue);
    }

    .field input,
    .field textarea {
      background: var(--off);
      border: 1px solid #eaecf2;
      border-radius: 12px;
      padding: 14px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--blue);
    }

    .field textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn-submit {
      display: inline-block;
      background: var(--blue);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }

    .success-msg {
      display: none;
      padding: 40px 0;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue);
    }

    @media (max-width: 600px) {
      .topnav { padding: 0 20px; }
      .page { padding: 60px 20px 80px; }
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <a class="topnav-logo" href="/">
      <svg viewBox="0 0 1400 280" style="width:auto;height:26px;display:block;overflow:visible;">
        <defs>
          <clipPath id="partnerWordmark"><text x="50%" y="64%" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="118" letter-spacing="-1" word-spacing="-29">Paris Sport Week</text></clipPath>
          <linearGradient id="partnerWordmarkGrad" gradientUnits="userSpaceOnUse" x1="150" y1="60" x2="1250" y2="220">
            <stop offset="0%" stop-color="#453F3A"/><stop offset="32%" stop-color="#6E6A65"/><stop offset="65%" stop-color="#A6A199"/><stop offset="100%" stop-color="#D9D6D1"/>
          </linearGradient>
          <filter id="partnerWordmarkTex" x="-15%" y="-40%" width="130%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.008 0.016" numOctaves="3" seed="27" result="n"/>
            <feGaussianBlur in="n" stdDeviation="6" result="nb"/>
            <feDisplacementMap in="SourceGraphic" in2="nb" scale="55" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <g clip-path="url(#partnerWordmark)"><rect x="-40" y="-40" width="1480" height="360" fill="url(#partnerWordmarkGrad)" filter="url(#partnerWordmarkTex)"/></g>
      </svg>
    </a>
    <a class="topnav-back" href="/">Retour</a>
  </nav>

  <div class="page">
    <div class="chip">Collaboration</div>
    <h1 class="page-title" style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      Collaboration avec
      <svg viewBox="0 0 600 260" style="width:auto;height:0.85em;display:inline-block;overflow:visible;">
        <defs>
          <clipPath id="clipPSWpartner">
            <text x="0" y="190" font-family="'Archivo Black', sans-serif" font-size="150" letter-spacing="-14">PSW</text>
          </clipPath>
          <linearGradient id="gradPSWpartner" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="440" y2="220">
            <stop offset="0%" stop-color="#1E1B19"/>
            <stop offset="32%" stop-color="#453F3A"/>
            <stop offset="65%" stop-color="#847E75"/>
            <stop offset="100%" stop-color="#B3AEA5"/>
          </linearGradient>
          <filter id="cloudPSWpartner" x="-40%" y="-40%" width="180%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="21" result="n"/>
            <feGaussianBlur in="n" stdDeviation="6" result="nb"/>
            <feDisplacementMap in="SourceGraphic" in2="nb" scale="55" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <g clip-path="url(#clipPSWpartner)">
          <rect x="-40" y="-40" width="680" height="340" fill="url(#gradPSWpartner)" filter="url(#cloudPSWpartner)"/>
        </g>
      </svg>
    </h1>
    <p class="page-sub" style="font-family:'Playfair Display',Georgia,serif; font-size:18px; font-weight:300; color:var(--navy); margin-bottom:12px;">Proposition :</p>

    <form class="form-wrap" id="partner-form">
      <div class="field">
        <label class="field-label">Nom de l'entreprise</label>
        <input type="text" name="entreprise" required>
      </div>
      <div class="field">
        <label class="field-label">Email de contact</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label class="field-label">De quelle offre souhaitez-vous me parler ?</label>
        <textarea name="offre" required></textarea>
      </div>
      <button class="btn-submit" type="submit">Envoyer</button>
    </form>

    <div class="success-msg" id="success">
      Proposition reçue. On revient vers toi rapidement.
    </div>
  </div>

  <script>
    document.getElementById('partner-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = document.getElementById('partner-form');
      var data = new FormData(form);
      data.append('_subject', 'Nouvelle proposition de collaboration Paris Sport Week');
      data.append('_captcha', 'false');
      fetch('https://formsubmit.co/ajax/parissportweek@protonmail.com', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: data
      })
      .then(function() {
        form.style.display = 'none';
        document.getElementById('success').style.display = 'block';
      })
      .catch(function() {
        form.style.display = 'none';
        document.getElementById('success').style.display = 'block';
      });
    });
  </script>

</body>
</html>
